name: 'DigitalOcean DB Trusted Sources'
description: 'Add or remove the GitHub runner IP from a DigitalOcean Managed Database firewall'
branding:
  icon: database
  color: blue
inputs:
  action:
    description: "'add' or 'remove'"
    required: true
  database_id:
    description: 'UUID of the managed database'
    required: true
  digitalocean_token:
    description: 'DigitalOcean personal access token'
    required: true
runs:
  using: composite
  steps:
    - name: Download and verify binary
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        if [ "${RUNNER_OS}" != "Linux" ]; then
          echo "unsupported OS: ${RUNNER_OS} (only Linux is supported)" >&2
          exit 1
        fi

        case "${RUNNER_ARCH}" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported arch: ${RUNNER_ARCH}" >&2; exit 1 ;;
        esac

        tag="${ACTION_REF}"
        name="do-db-trusted-sources_linux_${arch}"
        base="https://github.com/${ACTION_REPO}/releases/download/${tag}"

        workdir="${RUNNER_TEMP}/do-db-trusted-sources"
        mkdir -p "$workdir"
        cd "$workdir"

        echo "downloading $base/$name"
        curl -fsSL "$base/$name" -o "$name"

        echo "downloading $base/checksums.txt"
        curl -fsSL "$base/checksums.txt" -o checksums.txt

        echo "verifying sha256"
        # checksums.txt has all platforms; filter to just our binary
        grep " ${name}$" checksums.txt | sha256sum -c -

        chmod +x "$name"
        echo "BIN=${workdir}/${name}" >> "$GITHUB_ENV"

    - name: Run
      shell: bash
      env:
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_DATABASE_ID: ${{ inputs.database_id }}
        INPUT_DIGITALOCEAN_TOKEN: ${{ inputs.digitalocean_token }}
      run: "$BIN"
